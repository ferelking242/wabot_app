name: wabot_app
description: Premium Flutter dashboard for managing WhatsApp bots
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.10
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.4

  # Networking
  dio: ^5.4.1
  web_socket_channel: ^2.4.4
  http: ^1.2.1

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # UI / Design
  responsive_framework: ^1.2.1
  flex_color_scheme: ^7.3.1
  flutter_animate: ^4.5.0
  animations: ^2.0.11
  shimmer: ^3.0.0
  google_fonts: ^6.2.1

  # Charts
  fl_chart: ^0.67.0

  # Desktop
  window_manager: ^0.3.9

  # Utils
  qr_flutter: ^4.1.0
  cached_network_image: ^3.3.1
  timeago: ^3.6.1
  intl: ^0.19.0
  uuid: ^4.4.0
  icons_plus: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  json_annotation: ^4.9.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf

name: wabot_app
description: "Wabot — WhatsApp Bot Dashboard by Aivos"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # Theme
  flex_color_scheme: 8.2.0

  # Responsive
  responsive_framework: ^1.5.1

  # Animations
  animations: ^2.0.11
  flutter_animate: ^4.5.0

  # Charts
  fl_chart: ^0.69.0

  # Desktop popups
  flutter_popup: ^3.3.9

  # QR Code
  qr_flutter: ^4.1.0

  # Storage
  shared_preferences: ^2.3.3

  # HTTP
  http: ^1.2.0

  # WebSocket
  web_socket_channel: ^2.4.5

  # Skeleton
  skeletonizer: ^1.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

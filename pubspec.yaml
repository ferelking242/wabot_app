name: wabot_app
description: "WhatsApp Bot Dashboard - Wabot"
publish_to: none
version: 1.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # Theme
  flex_color_scheme: 8.2.0

  # Responsive
  responsive_framework: ^1.5.1

  # Animations
  animations: ^2.0.11
  flutter_animate: ^4.5.0

  # Charts
  fl_chart: ^0.69.0

  # Desktop popups
  flutter_popup: ^3.3.9

  # QR Code
  qr_flutter: ^4.1.0

  # Storage
  shared_preferences: ^2.3.3

  # Platform paths (for Android data dir)
  path_provider: ^2.1.4

  # HTTP
  http: ^1.2.0
  dio: ^5.7.0

  # WebSocket
  web_socket_channel: ^2.4.5

  # Skeleton
  skeletonizer: ^1.4.3

  # Supabase — cloud session & account management
  supabase_flutter: ^2.8.4

  # Device info — hardware details after QR scan
  device_info_plus: ^10.1.2

  # Package info — app version
  package_info_plus: ^8.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/nodejs-project/

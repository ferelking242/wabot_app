name: 🏗 Build All Platforms

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - 'web/**'
      - 'linux/**'
      - 'assets/**'
  workflow_dispatch:

concurrency:
  group: build-all
  cancel-in-progress: true

jobs:
  android:
    name: Android APK (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Decode keystore
        if: ${{ env.WABOT_KEYSTORE_B64 != '' }}
        env:
          WABOT_KEYSTORE_B64: ${{ secrets.WABOT_KEYSTORE_B64 }}
        run: |
          echo "$WABOT_KEYSTORE_B64" | base64 -d > /tmp/wabot-release.p12
          echo "WABOT_KEYSTORE_PATH=/tmp/wabot-release.p12" >> $GITHUB_ENV
      - name: Build APK
        env:
          WABOT_STORE_PASSWORD: ${{ secrets.WABOT_STORE_PASSWORD }}
          WABOT_KEY_ALIAS: ${{ secrets.WABOT_KEY_ALIAS }}
          WABOT_KEY_PASSWORD: ${{ secrets.WABOT_KEY_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: wabot-android-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href "/wabot_app/"
      - uses: actions/upload-artifact@v4
        with:
          name: wabot-web
          path: build/web
          retention-days: 7

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: wabot-linux-x64
          path: build/linux/x64/release/bundle
          retention-days: 30

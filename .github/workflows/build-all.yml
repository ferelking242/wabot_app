name: 🏗 Build All Platforms

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - 'web/**'
      - 'assets/**'
  workflow_dispatch:

concurrency:
  group: build-all
  cancel-in-progress: true

jobs:
  android:
    name: Android APK (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Cache Node.js Mobile binaries
        id: cache-nodejs-mobile
        uses: actions/cache@v4
        with:
          path: |
            android/app/src/main/jniLibs
            android/app/src/main/cpp/node_include
          key: nodejs-mobile-18.20.4-v2

      - name: Download Node.js Mobile binaries and headers
        if: steps.cache-nodejs-mobile.outputs.cache-hit != 'true'
        run: |
          NODE_VERSION="18.20.4"
          ZIP_URL="https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v${NODE_VERSION}/nodejs-mobile-v${NODE_VERSION}-android.zip"
          echo "Downloading Node.js Mobile v${NODE_VERSION}..."
          curl -L -o /tmp/nodejs-mobile.zip "$ZIP_URL"
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p android/app/src/main/jniLibs/x86_64
          mkdir -p android/app/src/main/cpp/node_include/node
          unzip -p /tmp/nodejs-mobile.zip "bin/arm64-v8a/libnode.so" \
            > android/app/src/main/jniLibs/arm64-v8a/libnode.so
          unzip -p /tmp/nodejs-mobile.zip "bin/armeabi-v7a/libnode.so" \
            > android/app/src/main/jniLibs/armeabi-v7a/libnode.so
          unzip -p /tmp/nodejs-mobile.zip "bin/x86_64/libnode.so" \
            > android/app/src/main/jniLibs/x86_64/libnode.so
          unzip /tmp/nodejs-mobile.zip "include/node/*" -d /tmp/nodejs-mobile-headers/
          cp -r /tmp/nodejs-mobile-headers/include/node/* \
            android/app/src/main/cpp/node_include/node/
          echo "Done. Headers:"
          ls android/app/src/main/cpp/node_include/node/ | head -5

      - run: flutter pub get
      - name: Decode keystore
        if: ${{ env.WABOT_KEYSTORE_B64 != '' }}
        env:
          WABOT_KEYSTORE_B64: ${{ secrets.WABOT_KEYSTORE_B64 }}
        run: |
          echo "$WABOT_KEYSTORE_B64" | base64 -d > /tmp/wabot-release.p12
          echo "WABOT_KEYSTORE_PATH=/tmp/wabot-release.p12" >> $GITHUB_ENV
      - name: Build APK
        env:
          WABOT_STORE_PASSWORD: ${{ secrets.WABOT_STORE_PASSWORD }}
          WABOT_KEY_ALIAS: ${{ secrets.WABOT_KEY_ALIAS }}
          WABOT_KEY_PASSWORD: ${{ secrets.WABOT_KEY_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: wabot-android-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href "/wabot_app/"
      - uses: actions/upload-artifact@v4
        with:
          name: wabot-web
          path: build/web
          retention-days: 7

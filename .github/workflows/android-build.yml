name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Install NDK 27 and CMake 3.22
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.0.12077973" \
            "cmake;3.22.1" \
            --sdk_root=$ANDROID_SDK_ROOT || true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wabot-android dependencies
        working-directory: wabot-android-src
        run: npm install

      - name: Bundle wabot-android with esbuild
        working-directory: wabot-android-src
        run: npm run build

      - name: Copy bundle to Flutter assets
        run: cp wabot-android-src/bundle.js assets/nodejs-project/main.js

      - name: Cache Node.js Mobile binaries
        id: cache-nodejs-mobile
        uses: actions/cache@v4
        with:
          path: |
            android/app/src/main/jniLibs
            android/app/src/main/cpp/node_include
          key: nodejs-mobile-18.20.4-arm64-v3

      - name: Download Node.js Mobile binaries and headers (arm64 only)
        if: steps.cache-nodejs-mobile.outputs.cache-hit != 'true'
        run: |
          NODE_VERSION="18.20.4"
          ZIP_URL="https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v${NODE_VERSION}/nodejs-mobile-v${NODE_VERSION}-android.zip"
          echo "Downloading Node.js Mobile v${NODE_VERSION}..."
          curl -L -o /tmp/nodejs-mobile.zip "$ZIP_URL"
          echo "Extracting arm64-v8a only..."
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/cpp/node_include/node
          unzip -p /tmp/nodejs-mobile.zip "bin/arm64-v8a/libnode.so" \
            > android/app/src/main/jniLibs/arm64-v8a/libnode.so
          unzip /tmp/nodejs-mobile.zip "include/node/*" -d /tmp/nodejs-mobile-headers/
          cp -r /tmp/nodejs-mobile-headers/include/node/* \
            android/app/src/main/cpp/node_include/node/
          echo "Node.js Mobile arm64 ready."
          ls -lh android/app/src/main/jniLibs/arm64-v8a/

      - name: Bundle libc++_shared.so from NDK (required by libnode.so)
        run: |
          NDK_PATH="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          LIBCPP="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          if [ -f "$LIBCPP" ]; then
            cp "$LIBCPP" android/app/src/main/jniLibs/arm64-v8a/libc++_shared.so
            echo "libc++_shared.so copied: $(ls -lh android/app/src/main/jniLibs/arm64-v8a/libc++_shared.so)"
          else
            echo "ERROR: libc++_shared.so not found at $LIBCPP"
            find "$NDK_PATH/toolchains/llvm/prebuilt" -name "libc++_shared.so" | head -5
            exit 1
          fi

      - name: Flutter pub get
        run: flutter pub get

      # ── Signing keystore — clé fixe, mise en cache indéfiniment ─────────────
      # La clé de cache est FIXE (pas de hash) → le MÊME keystore est réutilisé
      # à chaque build. Cela évite l'erreur "package en conflit" sur Android.
      - name: Restore signing keystore from cache
        id: cache-keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/wabot-release.jks
          key: wabot-signing-keystore-v1

      - name: Generate signing keystore (première exécution uniquement)
        if: steps.cache-keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/wabot-release.jks \
            -alias wabot \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass wabot2024 -keypass wabot2024 \
            -dname "CN=Wabot,O=Wabot,L=Unknown,ST=Unknown,C=US"
          echo "✅ Keystore généré et mis en cache."

      - name: Write key.properties
        run: |
          mkdir -p ~/.android
          cat > android/key.properties <<EOF
          storePassword=wabot2024
          keyPassword=wabot2024
          keyAlias=wabot
          storeFile=$HOME/.android/wabot-release.jks
          EOF
          echo "✅ key.properties écrit."

      - name: Patch build.gradle for release signing
        run: |
          GRADLE="android/app/build.gradle"
          if ! grep -q "keystoreProperties" "$GRADLE"; then
            # Insère le bloc de chargement des propriétés en tête du fichier
            TMP=$(mktemp)
            cat > "$TMP" <<'GROOVY'
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

GROOVY
            cat "$TMP" "$GRADLE" > "$GRADLE.new" && mv "$GRADLE.new" "$GRADLE"

            # Insère signingConfigs juste avant buildTypes
            sed -i '/buildTypes {/i\
    signingConfigs {\
        release {\
            keyAlias keystoreProperties["keyAlias"]\
            keyPassword keystoreProperties["keyPassword"]\
            storeFile keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null\
            storePassword keystoreProperties["storePassword"]\
        }\
    }' "$GRADLE"

            # Ajoute signingConfig dans le bloc release
            sed -i '/release {/a\            signingConfig signingConfigs.release' "$GRADLE"

            echo "✅ build.gradle patché pour la signature release."
          else
            echo "ℹ️  build.gradle déjà patché — aucune modification."
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build release APK (arm64 only)
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wabot-arm64-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Print APK size and signing fingerprint
        run: |
          ls -lh build/app/outputs/flutter-apk/*.apk || true
          echo "--- Signing fingerprint ---"
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk 2>/dev/null \
            | grep -E "SHA256|Owner|Issuer" || true

name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Java ──────────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── Flutter ───────────────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      # ── Android NDK & CMake ───────────────────────────────────────────────────
      - name: Install NDK 25.2 and CMake 3.22
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "ndk;25.2.9519653" \
            "cmake;3.22.1" \
            --sdk_root=$ANDROID_SDK_ROOT || true
          echo "NDK_VERSION=25.2.9519653" >> $GITHUB_ENV

      # ── Node.js (for wabot bundle) ────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: wabot-android-src/package-lock.json

      # ── Build wabot-android bundle ────────────────────────────────────────────
      - name: Install wabot-android dependencies
        working-directory: wabot-android-src
        run: npm install

      - name: Bundle wabot-android with esbuild
        working-directory: wabot-android-src
        run: npm run build

      - name: Show bundle size
        run: du -sh wabot-android-src/bundle.js

      - name: Copy bundle to Flutter assets
        run: cp wabot-android-src/bundle.js assets/nodejs-project/main.js

      # ── Flutter dependencies ──────────────────────────────────────────────────
      - name: Flutter pub get
        run: flutter pub get

      # ── Cache Gradle ──────────────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ── Cache Node.js Mobile binaries ─────────────────────────────────────────
      - name: Cache Node.js Mobile binaries
        uses: actions/cache@v4
        with:
          path: |
            android/app/src/main/jniLibs
            android/app/src/main/cpp/node_include
          key: nodejs-mobile-18.20.4

      # ── Build APK ─────────────────────────────────────────────────────────────
      - name: Build release APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      # ── Upload artifacts ──────────────────────────────────────────────────────
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wabot-android-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Print APK sizes
        run: ls -lh build/app/outputs/flutter-apk/*.apk || true

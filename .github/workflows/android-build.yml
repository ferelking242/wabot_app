name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Install NDK 27 and CMake 3.22
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.0.12077973" \
            "cmake;3.22.1" \
            --sdk_root=$ANDROID_SDK_ROOT || true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wabot-android dependencies
        working-directory: wabot-android-src
        run: npm install

      - name: Bundle wabot-android with esbuild
        working-directory: wabot-android-src
        run: npm run build

      - name: Copy bundle to Flutter assets
        run: cp wabot-android-src/bundle.js assets/nodejs-project/main.js

      - name: Cache Node.js Mobile binaries
        id: cache-nodejs-mobile
        uses: actions/cache@v4
        with:
          path: |
            android/app/src/main/jniLibs
            android/app/src/main/cpp/node_include
          key: nodejs-mobile-18.20.4-v2

      - name: Download Node.js Mobile binaries and headers
        if: steps.cache-nodejs-mobile.outputs.cache-hit != 'true'
        run: |
          NODE_VERSION="18.20.4"
          ZIP_URL="https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v${NODE_VERSION}/nodejs-mobile-v${NODE_VERSION}-android.zip"
          echo "Downloading Node.js Mobile v${NODE_VERSION}..."
          curl -L -o /tmp/nodejs-mobile.zip "$ZIP_URL"
          echo "Extracting..."
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p android/app/src/main/jniLibs/x86_64
          mkdir -p android/app/src/main/cpp/node_include/node
          unzip -p /tmp/nodejs-mobile.zip "bin/arm64-v8a/libnode.so" \
            > android/app/src/main/jniLibs/arm64-v8a/libnode.so
          unzip -p /tmp/nodejs-mobile.zip "bin/armeabi-v7a/libnode.so" \
            > android/app/src/main/jniLibs/armeabi-v7a/libnode.so
          unzip -p /tmp/nodejs-mobile.zip "bin/x86_64/libnode.so" \
            > android/app/src/main/jniLibs/x86_64/libnode.so
          unzip /tmp/nodejs-mobile.zip "include/node/*" -d /tmp/nodejs-mobile-headers/
          cp -r /tmp/nodejs-mobile-headers/include/node/* \
            android/app/src/main/cpp/node_include/node/
          echo "Node.js Mobile ready."
          ls -lh android/app/src/main/jniLibs/arm64-v8a/
          ls android/app/src/main/cpp/node_include/node/ | head -10

      - name: Flutter pub get
        run: flutter pub get

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build release APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wabot-android-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Print APK sizes
        run: ls -lh build/app/outputs/flutter-apk/*.apk || true

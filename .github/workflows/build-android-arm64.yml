name: Build Android ARM64

on:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-android-arm64.yml'
  workflow_dispatch:

jobs:
  build-android-arm64:
    name: Build Android ARM64 (armv8)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: stable
          cache: true

      - name: Generate platform files
        run: flutter create --org com.ferelking242.wabot --project-name wabot_app --platforms=android . 2>/dev/null || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (ARM64 only)
        run: flutter build apk --target-platform android-arm64 --release --no-tree-shake-icons

      - name: Rename artifact
        run: |
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             build/app/outputs/flutter-apk/wabot-dashboard-arm64-v8a.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wabot-dashboard-arm64
          path: build/app/outputs/flutter-apk/wabot-dashboard-arm64-v8a.apk
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/wabot-dashboard-arm64-v8a.apk
          name: Wabot Dashboard ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

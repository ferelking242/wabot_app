name: 🤖 Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - '.github/workflows/build-android-arm64.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: APK arm64-v8a
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Decode keystore
        if: ${{ env.WABOT_KEYSTORE_B64 != '' }}
        env:
          WABOT_KEYSTORE_B64: ${{ secrets.WABOT_KEYSTORE_B64 }}
        run: |
          echo "$WABOT_KEYSTORE_B64" | base64 -d > /tmp/wabot-release.p12
          echo "WABOT_KEYSTORE_PATH=/tmp/wabot-release.p12" >> $GITHUB_ENV

      - name: Build APK arm64-v8a
        env:
          WABOT_STORE_PASSWORD: ${{ secrets.WABOT_STORE_PASSWORD }}
          WABOT_KEY_ALIAS: ${{ secrets.WABOT_KEY_ALIAS }}
          WABOT_KEY_PASSWORD: ${{ secrets.WABOT_KEY_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wabot-android-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30

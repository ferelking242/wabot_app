name: Build Android APK (arm64-v8a)

on:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK arm64-v8a
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          flutter create \
            --org com.ferelking242.wabot \
            --project-name wabot_app \
            --platforms=android \
            . 2>/dev/null || true

      - name: Set minSdkVersion
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' android/app/build.gradle 2>/dev/null || \
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle 2>/dev/null || \
          true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK arm64-v8a (release)
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --no-tree-shake-icons

      - name: List build outputs
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: wabot-arm64-v8a-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.sha }}
          name: "Wabot APK - arm64-v8a (${{ github.sha }})"
          body: |
            ## Wabot Dashboard APK (arm64-v8a)
            Built from commit `${{ github.sha }}`
            - Target: arm64-v8a (ARMv8)
            - Mode: release
            - Built: ${{ github.event.head_commit.timestamp }}
          files: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## APK Built Successfully!" >> $GITHUB_STEP_SUMMARY
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          if [ -f "$APK" ]; then
            SIZE=$(du -h "$APK" | cut -f1)
            echo "- **File**: app-arm64-v8a-release.apk" >> $GITHUB_STEP_SUMMARY
            echo "- **Size**: $SIZE" >> $GITHUB_STEP_SUMMARY
            echo "- **Target**: arm64-v8a (ARMv8)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Built**: $(date -u)" >> $GITHUB_STEP_SUMMARY
